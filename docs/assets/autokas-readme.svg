    <g stroke="#c48d4d" stroke-width="2" stroke-linecap="round" opacity=".55">
      <path d="M84 36 V150"/><path d="M118 60 V176"/><path d="M248 44 V130"/><path d="M280 90 V210"/>
    </g>
    <path d="M180 48 C130 92 104 150 106 214 L102 284 H258 L254 214 C256 150 230 92 180 48 Z" fill="#17202c"/>
    <path d="M56 284 C60 236 110 214 180 212 C250 214 300 236 304 284 Z" fill="#17202c"/>
    <path d="M180 84 C150 84 132 116 134 152 C136 186 156 206 180 206 C204 206 224 186 226 152 C228 116 210 84 180 84 Z" fill="#ecc48c"/>
    <path d="M148 146 Q160 152 172 146" fill="none" stroke="#17202c" stroke-width="3" stroke-linecap="round"/>
    <path d="M188 146 Q200 152 212 146" fill="none" stroke="#17202c" stroke-width="3" stroke-linecap="round"/>
    <path d="M181 160 V176 H188" fill="none" stroke="#17202c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="173" y="216" width="14" height="68" rx="3" fill="#d2643a"/>
