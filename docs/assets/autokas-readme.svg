  <g font-family="Oswald, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="360" y="130" fill="#f1e6d0" font-size="76" font-weight="700" letter-spacing="-1.5">autokas</text>
    <text x="364" y="177" fill="#9fb0c4" font-size="28" font-weight="500" letter-spacing="2">review fixes, run in the cloud</text>
    <text x="364" y="235" fill="#e9b877" font-size="22" font-weight="500">comment in. pushed fix out. then it leaves.</text>
