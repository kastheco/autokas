<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title description">
  <title id="title">autokas</title>
  <desc id="description">autokas logo, a hooded figure with closed eyes and an orange zip, with the lines review comment in, pushed fix out</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2431"/>
      <stop offset="1" stop-color="#232f3f"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9b877"/>
      <stop offset="1" stop-color="#d9a35f"/>
    </linearGradient>
    <clipPath id="tile"><rect x="56" y="36" width="248" height="248" rx="22"/></clipPath>
  </defs>

  <rect x="4" y="4" width="952" height="312" rx="28" fill="url(#panel)" stroke="#33445a" stroke-width="8"/>
  <path d="M48 274 H912" stroke="#33445a" stroke-width="2"/>
  <path d="M48 274 H326" stroke="#d2643a" stroke-width="2"/>

