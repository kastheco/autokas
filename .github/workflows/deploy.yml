name: deploy runner
on:
  push:
    branches: [main]
  workflow_dispatch:
  # autokas-teams sends this after it publishes new images, so they roll out without a secret edit.
  repository_dispatch:
    types: [team-images-published]
permissions:
  contents: read
concurrency:
  group: omp-runner-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: test
        env:
          MODAL_ENVIRONMENT: main
        run: |
          cp config.example.json config.json
          python -m unittest discover -v
      - name: private_config
        id: private_config
        env:
          AUTOKAS_CONFIG_JSON: ${{ secrets.AUTOKAS_CONFIG_JSON }}
          AUTOKAS_ALLOWED_OWNERS_JSON: ${{ secrets.AUTOKAS_ALLOWED_OWNERS_JSON }}
          TEAMS_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, sys
          from urllib.parse import urlparse
          # Public settings, including version pins, come from the tracked config. The secret
          # supplies only private values, so a version bump never needs a secret change.
          PRIVATE_KEYS = ("docs_update", "jarvis_owner", "jarvis_url", "omp_models", "owner_approvals", "linear", "teams")
          try:
              private = json.loads(os.environ["AUTOKAS_CONFIG_JSON"])
              with open("config.example.json") as f:
                  config = json.load(f)
              config.update({key: private[key] for key in PRIVATE_KEYS if key in private})
          except Exception:
              sys.exit("AUTOKAS_CONFIG_JSON is missing, invalid, or still the example config")
          secret_teams = private.get("teams") or {}
          config["teams"] = secret_teams
          # Image digests come from autokas-teams, which records them after each publish, so a new
          # image never needs a secret edit. The secret still wins for every non-image team field.
          try:
              from published_teams import fetch_published, merge_published
              config["teams"] = merge_published(secret_teams, fetch_published(os.environ["TEAMS_TOKEN"]))
          except Exception as error:
              # Don't print the body: it names private repositories and this log is public.
              print(f"published team images unavailable ({type(error).__name__}); using the secret's teams")
          try:
              config["allowed_owners"] = json.loads(os.environ.get("AUTOKAS_ALLOWED_OWNERS_JSON") or "[]")
              url = urlparse(config["docs_update"]["webhook_url"])
              if url.scheme != "https" or not url.hostname or url.hostname.endswith(".invalid"):
                  raise ValueError
              fd = os.open("config.json", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
              with os.fdopen(fd, "w") as f:
                  json.dump(config, f, indent=2)
              os.chmod("config.json", 0o600)
          except Exception:
              sys.exit("AUTOKAS_CONFIG_JSON is missing, invalid, or still the example config")
          PY
          echo ready=true >> "$GITHUB_OUTPUT"
      - name: drain, deploy and reconcile
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
        run: |
          # Detailed output names private repositories, so it stays in a private runner file.
          umask 077
          status=0
          python -u deploy.py > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          echo "deploy exit status: $status"
          exit $status
      - name: reconcile after failure or cancellation
        if: always() && steps.private_config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_GH_TOKEN }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_ENVIRONMENT: main
          DEPLOY_CLEANUP: '1'
        run: |
          umask 077
          status=0
          python -u deploy.py > "$RUNNER_TEMP/reconcile.log" 2>&1 || status=$?
          echo "reconcile exit status: $status"
          exit $status
